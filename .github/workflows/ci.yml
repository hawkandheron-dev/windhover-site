name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            timeline-scratch/package-lock.json
      - run: npm ci
      # The app's dependencies live in timeline-scratch, not at the root, and
      # a unit test that imports app code needs them resolvable. Without this
      # the suite passes on a developer's machine (which has the tree from an
      # earlier build) and fails here — which is exactly how a broken unit job
      # went unnoticed for nine runs.
      - run: npm ci --prefix timeline-scratch
      - run: npm run test:unit

  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            timeline-scratch/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: apps/
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            timeline-scratch/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: apps/
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-browsers:
    # Lifelines in Firefox and Safari's engine. CI only tested Chromium, and
    # Safari treats BC dates and canvas differently (release plan, M4).
    name: E2E (Firefox, WebKit)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            timeline-scratch/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: apps/
      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --project=firefox --project=webkit
        env:
          PW_ALL_BROWSERS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-browsers
          path: |
            playwright-report/
            test-results/
          retention-days: 7
