<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Church History Supabase</title>

    <link rel="preload" href="resources/logos/Windhover_BLK.png" as="image" />
    <link rel="preload" href="resources/fonts/Outfit/static/Outfit-ExtraBold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      try {
        if (sessionStorage.getItem('windhover.loaderSeen') === '1') {
          document.documentElement.setAttribute('data-loader-seen', '');
        }
      } catch (_) {}
    </script>
    <style>
      #page-loader{position:fixed;inset:0;z-index:9999;background:#f5f0e1;display:flex;align-items:center;justify-content:center}
      #page-loader[hidden]{display:none!important}
      html[data-loader-seen] #page-loader{display:none!important}
    </style>
    <link rel="stylesheet" href="loader.css" />
    <script defer src="loader.js"></script>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="supabase.css" />
  </head>
  <body>
    <div id="page-loader" class="page-loader" role="progressbar" aria-label="Loading page" aria-busy="true">
      <div class="page-loader-inner">
        <img class="page-loader-logo" src="resources/logos/Windhover_BLK.png" alt="" width="120" height="120" />
        <h2 class="page-loader-title">Church History</h2>
        <div class="page-loader-sub">Loading</div>
        <div class="page-loader-cta">
          <div class="page-loader-bar" aria-hidden="true"></div>
          <button type="button" class="page-loader-enter">Enter</button>
        </div>
      </div>
    </div>
    <noscript><style>#page-loader{display:none!important}</style></noscript>

    <nav class="site-nav" aria-label="Primary">
      <a href="home.html#home">Home</a>
      <a href="church-history-supabase.html">CH Data Browser</a>
      <a href="apps/church-history-timeline.html">Church History Timeline</a>
      <a href="apps/church-history.html">CH Timeline (JSON)</a>
    </nav>

    <main class="supabase-shell">
      <header class="supabase-header">
        <div class="supabase-header-content">
          <div>
            <h1>Church History Supabase</h1>
            <p>Browser for church history data stored in Supabase.</p>
          </div>
          <a
            class="button"
            href="https://supabase.com/dashboard/project/fnxsfdbbnjbveyjmwanc/editor/19967?schema=public"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open in Supabase Admin
          </a>
        </div>
      </header>

      <section class="supabase-card" aria-live="polite">
        <div class="supabase-controls">
          <label>
            Table
            <select id="tableSelect"></select>
          </label>
          <label>
            Row limit
            <input id="limitInput" type="number" min="1" max="500" value="50" />
          </label>
          <label>
            Search (client-side)
            <input id="searchInput" type="search" placeholder="Type to filter results" />
          </label>
        </div>

        <div class="supabase-actions">
          <button class="button" id="refreshButton" type="button">Refresh</button>
          <button class="button" id="loadMoreButton" type="button" style="display: none;">Load More</button>
          <span class="supabase-pill" id="rowCount">Rows: 0</span>
        </div>

        <div class="supabase-status" id="status"></div>

        <div class="supabase-table-wrap" id="tableWrap">
          <div class="supabase-empty">Select a table to load data.</div>
        </div>
      </section>
    </main>

    <!-- Supabase config: served by Cloudflare Pages Function in production,
         falls back to local supabase-config.js for development. -->
    <script>
      (function loadSupabaseConfig() {
        var status = document.getElementById("status");

        function loadApp() {
          var app = document.createElement("script");
          app.type = "module";
          app.src = "church-history-app.js";
          document.head.appendChild(app);
        }

        function tryLoad(src, onFail) {
          var s = document.createElement("script");
          s.src = src;
          s.onload = loadApp;
          s.onerror = onFail || function () {
            if (status) {
              status.textContent = "Could not load Supabase configuration.";
              status.classList.add("supabase-error");
            }
          };
          document.head.appendChild(s);
        }

        tryLoad("/api/supabase-config", function () {
          tryLoad("supabase-config.js");
        });
      })();
    </script>
  </body>
</html>
