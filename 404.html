<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Lifelines</title>
  <link rel="icon" type="image/png" href="/apps/windhover-logo.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cormorant:wght@600&display=swap" />
  <style>
    /* Served by Cloudflare Pages for any unknown path, at any depth, so every
       URL here is absolute. Lifelines' tokens (DESIGN.md §3–4): white ground,
       ink greys, one action in the AA-passing action blue. */
    :root {
      --ink: #23231f;
      --ink-light: #45453e;
      --ink-faded: #6e6e66;
      --action: #3f63d0;
      --action-hover: #3352b4;
      --border: rgba(30, 28, 24, 0.12);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #ffffff;
      color: var(--ink);
      font-family: 'Alegreya Sans', 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 32rem; text-align: center; }
    img { width: 56px; height: auto; opacity: 0.85; }
    h1 {
      font-family: 'Cormorant', Georgia, 'Times New Roman', serif;
      font-weight: 600;
      font-size: 2.25rem;
      line-height: 1.15;
      margin: 16px 0 8px;
    }
    p { margin: 0 0 24px; color: var(--ink-light); font-size: 1.0625rem; text-wrap: balance; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--action);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: var(--action-hover); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/resources/logos/Windhover_BLK.png" alt="Windhover" />
    <h1>Page not found</h1>
    <p>There's nothing at this address. It may have moved, or the link may have a typo.</p>
    <a href="/">Go to Lifelines</a>
  </main>
</body>
</html>
